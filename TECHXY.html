<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHXY AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="name">
        <header>TECHXY AI</header>
    </section>
    <section>
       <div id="box">
        <div class="container">
          <h1 id="h2">FIND YOUR EMOJI</h1>
          <span id="emoji" aria-live="polite">😀</span>
          <button class="bt" type="button" onclick="generateemoji()">
            GENERATE EMOJI
          </button>
          <script>
            let emojis = ["😀", "😃", "😄", "😁", "😆", "😅", "😂",
            "🤣", "🥲", "☺️", "😊", "😇", "🙂", "🙃", "😉", "😌",
            "😍", "🥰", "😘", "😗", "😙", "😚", "😋", "😛", "😝",
            "😜", "🤪"];
            function generateemoji() {
              let randomindex = Math.floor(Math.random() * emojis.length);
              document.getElementById("emoji").textContent = emojis[randomindex];
            }
            generateemoji();
          </script>
        </div>
       </div>
    </section>
</body>
</html>
