<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techxy AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='16' fill='%23111827' stroke='%2322D3EE' stroke-width='2'/%3E%3Cpath d='M20 22H44M32 22V45' stroke='%2322D3EE' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="Techxy.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 64 64" role="img" aria-label="Techxy AI logo">
        <rect x="3" y="3" width="58" height="58" rx="16" fill="#111827" stroke="#22D3EE" stroke-width="2"/>
        <path d="M20 22H44M32 22V45" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" fill="none"/>
        <circle cx="20" cy="22" r="4" fill="#A78BFA"/>
        <circle cx="44" cy="22" r="4" fill="#A78BFA"/>
        <circle cx="32" cy="45" r="4" fill="#A78BFA"/>
      </svg>
      <span>Techxy <span class="accent">AI</span></span>
    </div>
    <button id="newChat" class="new-chat" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
  </aside>

  <main class="main">
    <div id="welcome" class="welcome">
      <h1>How can I help you <span class="accent">today?</span></h1>
      <div class="chips">
        <button type="button" class="chip" data-prompt="Write a simple JavaScript function that adds two numbers.">Write code</button>
        <button type="button" class="chip" data-prompt="Explain what an API is in simple words.">Explain a topic</button>
        <button type="button" class="chip" data-prompt="Give me 5 project ideas for a beginner web developer.">Brainstorm ideas</button>
        <button type="button" class="chip" data-prompt="Summarize this text in 3 lines: ">Summarize text</button>
      </div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <form id="form" class="composer">
      <input id="input" type="text" autocomplete="off" aria-label="Message Techxy AI" placeholder="Message Techxy AI…" maxlength="4000">
      <button id="send" class="send" type="submit" aria-label="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="note">Techxy AI can make mistakes. Check important information.</p>
  </main>
</div>
<script src="Techxy.js"></script>
</body>
</html>
